        /* Blobs */
        .blob-container {

            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            will-change: transform;
        }
        .blob-1 {
            width: 350px;
            height: 350px;
            background: #3b82f6;
            top: -8%;
            left: -8%;
            animation: floatBlob1 12s infinite alternate ease-in-out;

        .blob-2 {

            height: 400px;
            background: #8b5cf6;
            bottom: -10%;
            right: -8%;
            animation: floatBlob2 14s infinite alternate ease-in-out;
        }
        .blob-3 {
            width: 250px;
            height: 250px;
            background: #ec4899;
            top: 50%;
            left: 50%;
            animation: floatBlob3 16s infinite alternate ease-in-out;
            opacity: 0.3;

        .dark .blob-1 {
            background: #1e3a8a;
            opacity: 0.6;

        .dark .blob-2 {
            background: #4c1d95;
            opacity: 0.6;

            background: #701a75;
            opacity: 0.35;

        @keyframes floatBlob1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 60px) scale(1.25); }
        }
        @keyframes floatBlob2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-60px, -80px) scale(1.3); }
        }
        @keyframes floatBlob3 {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-30%, -70%) scale(1.4); }
        }

        .grid-pattern {

            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            opacity: 0.04;

            transition: opacity 0.5s;

            opacity: 0.07;

        /* Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.45);

            border: 1px solid rgba(255, 255, 255, 0.6);

            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }

        /* Link Button */
        .link-btn {
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .link-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s;
        }
        .link-btn:hover::before {
            left: 100%;
        }
        .link-btn:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        }
        .dark .link-btn:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        .link-btn:active {
            transform: translateY(0) scale(0.97);
            transition: all 0.1s;
        }

        /* Highlight Link */
        .link-highlight {
            animation: pulseGlow 2s infinite;
            border: 2px solid rgba(59, 130, 246, 0.5) !important;
        }
        .dark .link-highlight {
            border: 2px solid rgba(96, 165, 250, 0.5) !important;
        }

        .badge-new {

            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            animation: bounceSoft 2s infinite;
            letter-spacing: 0.5px;
        }

        /* Ripple */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0);
            animation: rippleEffect 0.6s ease-out;
            pointer-events: none;
        }
        @keyframes rippleEffect {

                opacity: 0;
            }

            background: transparent;

            background: rgba(148, 163, 184, 0.4);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.7);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .dark .toast {
            background: #f1f5f9;
            color: #0f172a;
        }

// Fungsi play beep (sebagai fallback)
function playBeep(freq = 1500, duration = 0.10, type = 'sine') {
   
    try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + duration);
    } catch (e) {}
}

    function renderQRCode() {
        qrCodeContainer.innerHTML = '';
        const url = window.location.href;
        const size = 150;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const qctx = canvas.getContext('2d');
        qctx.fillStyle = '#ffffff';
        qctx.fillRect(0, 0, size, size);
        qctx.fillStyle = '#000000';
        const modules = 21;
        const moduleSize = size / modules;
        let hash = 0;
        for (let i = 0; i < url.length; i++) {
            hash = ((hash << 5) - hash) + url.charCodeAt(i);
            hash |= 0;
        }
        const seededRandom = (seed) => {
            let s = seed;
            return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
        };
        const rand = seededRandom(Math.abs(hash));
        for (let row = 0; row < modules; row++) {
            for (let col = 0; col < modules; col++) {
                if (row < 7 && col < 7) { qctx.fillStyle = '#000'; qctx.fillRect(col*moduleSize, row*moduleSize, moduleSize, moduleSize); }
                else if (row < 7 && col > modules-8) { qctx.fillStyle = '#000'; qctx.fillRect(col*moduleSize, row*moduleSize, moduleSize, moduleSize); }
                else if (row > modules-8 && col < 7) { qctx.fillStyle = '#000'; qctx.fillRect(col*moduleSize, row*moduleSize, moduleSize, moduleSize); }
                else if (rand() > 0.5) { qctx.fillStyle = '#000'; qctx.fillRect(col*moduleSize, row*moduleSize, moduleSize, moduleSize); }
            }
        }
        qrCodeContainer.appendChild(canvas);
    }

    class Particle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * particleCanvas.width;
            this.y = Math.random() * particleCanvas.height;
            this.size = Math.random() * 2.5 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.5;
            this.speedY = (Math.random() - 0.5) * 0.5;
            this.opacity = Math.random() * CONFIG.background.particleOpacity + 0.1;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < -10) this.x = particleCanvas.width + 10;
            if (this.x > particleCanvas.width + 10) this.x = -10;
            if (this.y < -10) this.y = particleCanvas.height + 10;
            if (this.y > particleCanvas.height + 10) this.y = -10;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
            ctx.fillStyle = CONFIG.background.particleColor;
            ctx.globalAlpha = this.opacity;
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    function initParticles() {
        particlesArray = [];
        for (let i = 0; i < CONFIG.background.particleCount; i++) particlesArray.push(new Particle());
    }
    function animateParticles() {
        if (!CONFIG.background.particles) {
            ctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
            animationFrameId = requestAnimationFrame(animateParticles);
            return;
        }
        ctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
        for (let i = 0; i < particlesArray.length; i++) {
            for (let j = i+1; j < particlesArray.length; j++) {
                const dx = particlesArray[i].x - particlesArray[j].x;
                const dy = particlesArray[i].y - particlesArray[j].y;
                const dist = Math.sqrt(dx*dx+dy*dy);
                if (dist < 100) {
                    ctx.beginPath();
                    ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                    ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                    ctx.strokeStyle = CONFIG.background.particleColor;
                    ctx.globalAlpha = (1 - dist/100) * CONFIG.background.particleOpacity * 0.5;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }
            }
        }
        particlesArray.forEach(p => { p.update(); p.draw(); });
        animationFrameId = requestAnimationFrame(animateParticles);
    }
    function resizeCanvas() {

    function animateCount(elId, target) {
        const el = document.getElementById(elId);
        const start = 0;
        const duration = 1500;
        const startTime = performance.now();
        function update(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            el.textContent = Math.floor(start + (target - start) * eased);
            if (progress < 1) requestAnimationFrame(update);
            else el.textContent = target;
        }
        requestAnimationFrame(update);
    }
